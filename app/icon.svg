<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#101a4d"/><stop offset="0.55" stop-color="#2b1b66"/><stop offset="1" stop-color="#6a2c91"/>
    </linearGradient>
    <radialGradient id="glowBg" cx="0.72" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#6fc3ff" stop-opacity="0.45"/><stop offset="1" stop-color="#6fc3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nuc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#e8f6ff"/><stop offset="1" stop-color="#7fd0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ion" gradientUnits="userSpaceOnUse" x1="690" y1="340" x2="170" y2="860">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.25" stop-color="#8fdcff" stop-opacity="0.85"/><stop offset="1" stop-color="#3a7bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dust" gradientUnits="userSpaceOnUse" x1="700" y1="330" x2="330" y2="930">
      <stop offset="0" stop-color="#fff3c9" stop-opacity="0.9"/><stop offset="0.3" stop-color="#ffc979" stop-opacity="0.7"/><stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur14"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glowBg)"/>
    <!-- zodiac ring -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3">
      <circle cx="512" cy="560" r="360"/><circle cx="512" cy="560" r="318" stroke-opacity="0.09"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round">
      <g transform="translate(512 560)">
        <path d="M0 -360v-26" transform="rotate(0)"/><path d="M0 -360v-26" transform="rotate(30)"/><path d="M0 -360v-26" transform="rotate(60)"/>
        <path d="M0 -360v-26" transform="rotate(90)"/><path d="M0 -360v-26" transform="rotate(120)"/><path d="M0 -360v-26" transform="rotate(150)"/>
        <path d="M0 -360v-26" transform="rotate(180)"/><path d="M0 -360v-26" transform="rotate(210)"/><path d="M0 -360v-26" transform="rotate(240)"/>
        <path d="M0 -360v-26" transform="rotate(270)"/><path d="M0 -360v-26" transform="rotate(300)"/><path d="M0 -360v-26" transform="rotate(330)"/>
      </g>
    </g>
    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="170" cy="180" r="5" opacity="0.8"/><circle cx="300" cy="120" r="3" opacity="0.6"/><circle cx="880" cy="170" r="4" opacity="0.7"/>
      <circle cx="930" cy="560" r="4" opacity="0.6"/><circle cx="120" cy="520" r="3" opacity="0.7"/><circle cx="870" cy="880" r="5" opacity="0.5"/>
      <circle cx="600" cy="130" r="3" opacity="0.6"/><circle cx="200" cy="760" r="3" opacity="0.5"/><circle cx="780" cy="720" r="3" opacity="0.6"/>
      <circle cx="450" cy="250" r="2.5" opacity="0.5"/><circle cx="960" cy="330" r="3" opacity="0.5"/><circle cx="80" cy="330" r="2.5" opacity="0.5"/>
    </g>
    <!-- sparkles -->
    <g fill="#ffffff" opacity="0.9">
      <path d="M205 330l8 24 24 8-24 8-8 24-8-24-24-8 24-8z"/>
      <path d="M840 470l6 18 18 6-18 6-6 18-6-18-18-6 18-6z" opacity="0.8"/>
      <path d="M330 640l5 14 14 5-14 5-5 14-5-14-14-5 14-5z" opacity="0.7"/>
    </g>
    <!-- comet tails -->
    <g stroke-linecap="round" fill="none">
      <path d="M700 330 C560 410 400 560 190 880" stroke="url(#dust)" stroke-width="96" opacity="0.28" filter="url(#blur30)"/>
      <path d="M700 330 C600 400 470 520 300 920" stroke="url(#dust)" stroke-width="70" opacity="0.8"/>
      <path d="M700 330 C610 380 450 470 160 700" stroke="url(#ion)" stroke-width="44" opacity="0.35" filter="url(#blur14)"/>
      <path d="M700 330 C600 380 430 470 170 640" stroke="url(#ion)" stroke-width="22"/>
      <path d="M690 345 C600 400 440 520 250 770" stroke="url(#ion)" stroke-width="12" opacity="0.9"/>
      <path d="M715 320 C640 390 520 520 380 760" stroke="url(#dust)" stroke-width="10" opacity="0.9"/>
    </g>
    <!-- nucleus -->
    <circle cx="705" cy="326" r="150" fill="url(#nuc)" opacity="0.7" filter="url(#blur14)"/>
    <circle cx="705" cy="326" r="84" fill="url(#nuc)"/>
    <circle cx="705" cy="326" r="38" fill="#ffffff"/>
    <path d="M705 226v200M605 326h200" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
    <!-- gloss -->
    <path d="M0 0H1024V420C760 330 280 330 0 440Z" fill="url(#gloss)"/>
    <rect x="3" y="3" width="1018" height="1018" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>
  </g>
</svg>
