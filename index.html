<style>:root{--bg:#070b1f;--bg2:#0d1333;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);--txt:#eef1ff;--mut:#9aa4d0;--acc:#7fb4ff;--acc2:#b48bff;--gold:#ffd58a;--r:22px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"SF Pro Display","Segoe UI Variable","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt);background:radial-gradient(1200px 700px at 80% -10%,#2b1b66 0,transparent 60%),radial-gradient(900px 600px at -10% 110%,#10285f 0,transparent 55%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 22px;background:rgba(9,13,36,.72);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:19px;letter-spacing:.2px}
.brand img{width:38px;height:38px;border-radius:10px;box-shadow:0 4px 16px rgba(127,180,255,.35)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--mut);letter-spacing:1.4px;text-transform:uppercase;margin-top:-2px}
.search{flex:1;max-width:420px;margin:0 auto}
.search input{width:100%;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);font-size:14px;outline:none}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(127,180,255,.2)}
.who{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:14px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,#4a7bff,#a05cff)}
/* layout */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:22px;max-width:1500px;margin:0 auto;padding:22px}
.side{position:sticky;top:78px;align-self:start;display:flex;flex-direction:column;gap:6px}
.nav{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;color:var(--txt);cursor:pointer;border:1px solid transparent;transition:transform .18s,background .18s;font-size:15px;font-weight:500;user-select:none}
.nav i{font-style:normal;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,rgba(127,180,255,.25),rgba(180,139,255,.25))}
.nav:hover{background:var(--card);transform:translateX(3px);text-decoration:none}
.nav.on{background:var(--card2);border-color:var(--line);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.nav.on i{background:linear-gradient(135deg,#4a7bff,#a05cff)}
.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.rail{position:sticky;top:78px;align-self:start;display:flex;flex-direction:column;gap:16px}
/* cards: Apple TV style */
.card{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.35);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s}
.card.lift:hover{transform:translateY(-4px) scale(1.012);box-shadow:0 24px 60px rgba(60,80,200,.35);border-color:rgba(160,190,255,.4)}
h1{font-size:30px;margin:0 0 6px;letter-spacing:-.4px}
h2{font-size:21px;margin:0 0 10px;letter-spacing:-.2px}
h3{font-size:16px;margin:16px 0 6px;color:var(--gold)}
p{line-height:1.65;margin:0 0 12px;color:#dfe4ff}

.hero p{max-width:620px;position:relative;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:5px 12px;border-radius:999px;font-size:12.5px;background:rgba(255,255,255,.09);border:1px solid var(--line);color:#dbe3ff}
.chip.g{background:rgba(255,213,138,.14);border-color:rgba(255,213,138,.4);color:var(--gold)}
/* forms */
form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
input,select{padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);font-size:15px;outline:none;font-family:inherit;text-transform:none;letter-spacing:0;font-weight:400}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(127,180,255,.2)}
select option{background:#101640}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:14px;border:1px solid transparent;background:linear-gradient(135deg,#4a7bff,#a05cff);color:#fff;font-weight:600;font-size:15px;cursor:pointer;transition:transform .15s,box-shadow .15s;font-family:inherit}
.btn:hover{transform:scale(1.04);box-shadow:0 10px 30px rgba(110,100,255,.5)}
.btn.ghost{background:var(--card);border-color:var(--line);box-shadow:none}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:11px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.place-list{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.place{padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:14px}
.place:hover{border-color:var(--acc)}
.msg{font-size:13.5px;color:var(--gold);min-height:18px}
.msg.err{color:#ff9aa8}
/* profiles */
.profiles{display:flex;gap:18px;flex-wrap:wrap}
.prof{width:112px;text-align:center;cursor:pointer;transition:transform .2s}
.prof:hover{transform:scale(1.1)}
.prof .big{width:96px;height:96px;margin:0 auto 8px;border-radius:26px;display:grid;place-items:center;font-size:38px;font-weight:700;border:2px solid transparent;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.prof.on .big{border-color:#fff;box-shadow:0 0 0 4px rgba(127,180,255,.4),0 14px 36px rgba(0,0,0,.5)}
.prof small{display:block;color:var(--mut);font-size:11.5px}
.prof .x{font-size:11px;color:var(--mut);cursor:pointer}
/* chart */
.wheelwrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:1100px){.wheelwrap{grid-template-columns:1fr}}
svg.wheel{width:100%;height:auto;border-radius:50%;background:radial-gradient(circle,#0e1642,#080c26)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.8px}
.gl{font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols",sans-serif;color:var(--gold);font-size:17px}
.easy{color:#8fe3b4}.hard{color:#ff9aa8}.neutral{color:#ffd58a}
/* grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ref h3{margin:4px 0 6px;color:var(--txt);font-size:17px}
.ref .tier{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-weight:700}
.ref p{font-size:14px;color:#cdd5f7}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:14px}
.tab.on{background:linear-gradient(135deg,#4a7bff,#a05cff);border-color:transparent}
.month{border-left:3px solid var(--acc2);padding-left:14px;margin:16px 0 6px}
.ev{display:flex;gap:12px;margin:8px 0}
.ev b{min-width:92px;color:var(--gold);font-weight:600;font-size:13.5px}
.ev span{font-size:14.5px;line-height:1.55;color:#dfe4ff}
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .4s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.foot{text-align:center;color:var(--mut);font-size:12.5px;padding:10px 0 30px}
.tiny{font-size:12.5px;color:var(--mut)}
.mini{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.mini:last-child{border:0}
@media(max-width:1180px){.shell{grid-template-columns:200px minmax(0,1fr)}.rail{display:none}}
@media(max-width:760px){.shell{grid-template-columns:1fr;padding:12px}.side{position:static;flex-direction:row;overflow-x:auto}.nav span{display:none}.search{display:none}}
@media print{body{background:#fff;color:#000}#stars,.top,.side,.rail,.actions,.foot{display:none!important}.shell{display:block;padding:0}.card{background:#fff;border:1px solid #bbb;box-shadow:none;color:#000;break-inside:avoid}p,.ev span{color:#111}h3,.ev b,.gl{color:#6a3d00}.mut,.tiny{color:#444}svg.wheel{background:#0b1030}}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.news img{width:100%;height:150px;object-fit:cover;border-radius:14px;margin-bottom:10px;display:block}
.card a.btn{text-decoration:none}

/* v0.3 consumer polish */
:root{--bg:#06091b;--bg2:#0c1232;--card:rgba(255,255,255,.065);--card2:rgba(255,255,255,.115);--line:rgba(199,211,255,.15);--txt:#f5f6ff;--mut:#aab3da;--acc:#8bc5ff;--acc2:#c39bff;--gold:#ffdc98;--good:#77e5b0;--warn:#ff9dad;--r:24px}
body{min-width:320px;letter-spacing:.01em}
button,input,select{font:inherit}
button{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.skip{position:fixed;left:12px;top:-80px;z-index:1000;padding:10px 16px;border-radius:10px;background:#fff;color:#080d24;font-weight:700}
.skip:focus{top:12px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.top{min-height:68px}
.brand img{width:42px;height:42px;border-radius:12px}
.plan-badge{display:inline-flex;align-items:center;white-space:nowrap;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:#dce7ff;background:rgba(255,255,255,.07);font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.plan-badge.pro{color:#171126;background:linear-gradient(135deg,#ffe8a6,#d8b5ff);border:0}
.plan-badge.supporter{color:#10221c;background:linear-gradient(135deg,#8ce8bc,#8bc5ff);border:0}
.plan-badge.free_ads{color:var(--gold);border-color:rgba(255,220,152,.4)}
.nav{width:100%;appearance:none;background:transparent;text-align:left;font-family:inherit}
.nav i{flex:0 0 auto}
.nav:focus-visible{outline-offset:0}
.main:focus{outline:none}
.eyebrow,.sponsor-label{display:block;margin-bottom:6px;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:1.25px;text-transform:uppercase}
.hero.compact{padding:28px 30px}
.hero.compact:after{width:230px;height:230px;right:-35px;top:-45px}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.05;max-width:720px}
.hero p{font-size:16px}
.onboard{position:relative;z-index:1;display:flex;gap:10px;margin-top:22px;max-width:720px}
.onboard>div{display:flex;align-items:center;gap:9px;flex:1;padding:11px 13px;border:1px solid rgba(255,255,255,.14);border-radius:15px;background:rgba(7,10,31,.24);font-size:13px}
.onboard b{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:rgba(255,255,255,.14);color:var(--gold)}
.form-line,.planner-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.form-line .grow{flex:1;min-width:240px}
.planner-controls label{min-width:160px}
.planner-controls button{margin-bottom:1px}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.loading,.error-state{text-align:center;padding:40px}
.error-state{border-color:rgba(255,157,173,.4)}
.lock{border-color:rgba(255,220,152,.28)}
.plans-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.plan-card.current{outline:2px solid var(--gold);background:linear-gradient(150deg,rgba(255,220,152,.14),rgba(255,255,255,.04))}
.plan-card ul{margin:14px 0;padding-left:20px;color:#dfe4ff;line-height:1.65}
.sponsor{border-color:rgba(139,197,255,.3);background:linear-gradient(145deg,rgba(76,124,184,.14),rgba(255,255,255,.035))}
.sponsor-body{display:flex;gap:20px;align-items:center;justify-content:space-between}
.sponsor-body p{max-width:720px}
.sponsor .chip{text-decoration:none}
.tabs button{color:var(--txt)}
.planner-layout{display:grid;grid-template-columns:minmax(410px,.9fr) minmax(0,1.2fr);gap:20px;align-items:start}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px}
.section-head h2{font-size:26px}
.legend{display:flex;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:.6px}
.legend span{padding:4px 7px;border-radius:999px}
.legend .flow,.overall-score.flow{background:rgba(119,229,176,.15);color:var(--good)}
.legend .steady,.overall-score.steady{background:rgba(139,197,255,.14);color:var(--acc)}
.legend .caution,.overall-score.caution{background:rgba(255,157,173,.15);color:var(--warn)}
.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.weekdays{margin-bottom:7px;color:var(--mut);font-size:10px;font-weight:800;letter-spacing:.8px;text-align:center;text-transform:uppercase}
.cal-empty{min-height:54px}
.cal-day{position:relative;min-height:58px;padding:7px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.035);cursor:pointer;text-align:left;transition:transform .15s,border-color .15s,background .15s}
.cal-day:hover{transform:translateY(-2px);border-color:var(--acc)}
.cal-day.selected{border-color:#fff;box-shadow:0 0 0 2px rgba(139,197,255,.45);background:rgba(139,197,255,.13)}
.cal-day span{display:block;color:var(--mut);font-size:11px}
.cal-day b{font-size:17px}
.cal-day i{position:absolute;right:7px;top:7px;width:7px;height:7px;border-radius:50%;box-shadow:0 0 9px currentColor}
.cal-day.flow b{color:var(--good)}.cal-day.caution b{color:var(--warn)}.cal-day.steady b{color:var(--acc)}
.highlights{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.highlights h3{margin:0 0 8px}
.day-link{display:flex;justify-content:space-between;width:100%;padding:6px 8px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--txt);cursor:pointer}
.day-link:hover{background:var(--card)}
.overall-score{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:70px;height:62px;border-radius:18px;font-size:25px;font-weight:800}
.overall-score small{font-size:9px;text-transform:uppercase;letter-spacing:.8px}
.moon-strip{display:flex;gap:13px;align-items:center;margin-bottom:16px;padding:14px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.035)}
.moon-dot{width:38px;height:38px;flex:0 0 auto;border-radius:50%;box-shadow:inset -8px -4px 0 rgba(0,0,0,.2),0 0 18px rgba(139,197,255,.2)}
.moon-strip b,.moon-strip small{display:block}
.moon-strip small{margin-top:4px;color:var(--mut);line-height:1.45}
.domain-list{display:flex;flex-direction:column;gap:12px}
.domain-card{display:grid;grid-template-columns:76px minmax(0,1fr);gap:15px;padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035)}
.domain-card.flow{border-color:rgba(119,229,176,.25)}.domain-card.caution{border-color:rgba(255,157,173,.28)}
.score-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle closest-side,#101638 76%,transparent 78% 99%),conic-gradient(var(--acc) calc(var(--score)*1%),rgba(255,255,255,.1) 0)}
.flow .score-ring{background:radial-gradient(circle closest-side,#101638 76%,transparent 78% 99%),conic-gradient(var(--good) calc(var(--score)*1%),rgba(255,255,255,.1) 0)}
.caution .score-ring{background:radial-gradient(circle closest-side,#101638 76%,transparent 78% 99%),conic-gradient(var(--warn) calc(var(--score)*1%),rgba(255,255,255,.1) 0)}
.score-ring b{font-size:22px}.score-ring span{font-size:9px;color:var(--mut)}
.domain-copy h3{margin:3px 0 8px;color:var(--txt)}
.domain-copy p{margin-bottom:7px;font-size:13.5px}
details{font-size:13px;color:#dfe4ff}
summary{cursor:pointer;color:var(--acc);font-weight:700}
details ul{margin:8px 0 0;padding-left:18px;line-height:1.5}
.safety{border-color:rgba(255,220,152,.25)}
.safety p{margin:5px 0 0;font-size:13px;color:var(--mut)}
.rail-plan{background:linear-gradient(150deg,rgba(139,197,255,.12),rgba(195,155,255,.08))}

@media(max-width:1450px){
  .planner-layout{grid-template-columns:1fr}
  .calendar-card{position:static}
}
@media(max-width:760px){
  .top{padding:8px 12px;gap:8px}.brand{font-size:17px}.brand small{display:none}.brand img{width:36px;height:36px}
  #editionBadge{margin-left:auto}.plan-badge{font-size:9px;padding:5px 7px}.who{padding:3px}.who span{display:none}.av{width:30px;height:30px}
  .shell{padding:10px 10px 92px}.side{position:fixed;z-index:40;left:8px;right:8px;bottom:8px;top:auto;display:flex;gap:3px;padding:6px;border:1px solid var(--line);border-radius:20px;background:rgba(8,12,34,.9);backdrop-filter:blur(18px);overflow-x:auto;scrollbar-width:none;box-shadow:0 12px 35px rgba(0,0,0,.5)}
  .side::-webkit-scrollbar{display:none}
  .nav{flex:0 0 58px;justify-content:center;padding:7px 3px;border-radius:13px}.nav i{width:34px;height:34px}
  .card{padding:19px 17px;border-radius:20px}.hero,.hero.compact{padding:25px 20px}.hero:after{opacity:.1}
  .onboard{flex-direction:column}.onboard>div{flex:none}
  .plans-grid{grid-template-columns:1fr}.sponsor-body{align-items:flex-start;flex-direction:column}
  .planner-controls{display:grid;grid-template-columns:auto 1fr auto}.planner-controls label{min-width:0}.planner-controls label:last-child{grid-column:1/-1}.planner-controls #ptoday{display:none}
  .weekdays,.calendar{gap:4px}.cal-day{min-height:52px;padding:5px;border-radius:10px}.cal-day b{font-size:15px}.cal-day i{right:5px;top:5px}
  .domain-card{grid-template-columns:58px minmax(0,1fr);padding:13px;gap:10px}.score-ring{width:54px;height:54px}.score-ring b{font-size:17px}
  .section-head{align-items:center}.section-head h2{font-size:22px}.legend{display:none}
}
@media(max-width:420px){
  .calendar-card{padding:15px 11px}.cal-day{min-height:46px}.cal-day span{font-size:9px}.cal-day b{font-size:13px}
  .highlights{grid-template-columns:1fr}.moon-strip{align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media print{
  .sponsor,.planner-controls,.tabs,.plan-badge{display:none!important}
  .planner-layout{grid-template-columns:1fr}.calendar-card{break-after:page}
}
</style>
</head>

const SIGN_GLYPH = "♈♉♊♋♌♍♎♏♐♑♒♓".split("");

const BODIES = ["Sun","Moon","Mercury","Venus","Mars","Jupiter","Saturn","Uranus","Neptune","Pluto"];

const ASPECTS = [
  {name:"Conjunction", angle:0, orb:8, g:"☌", tone:"neutral"},

const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const norm = x => ((x % 360) + 360) % 360;
const diff180 = x => ((x + 540) % 360) - 180;

function fmtLon(l) {
  const s = Math.floor(l / 30), d = l - 30 * s;
  const dd = Math.floor(d), mm = Math.floor((d - dd) * 60);
  return `${dd}°${String(mm).padStart(2, "0")}′ ${SIGNS[s]}`;
}
const signOf = l => SIGNS[Math.floor(norm(l) / 30)];

function bodyLon(name, date) {
  const t = Astronomy.MakeTime(date);
  const vec = Astronomy.GeoVector(name, t, true);
  const v = Astronomy.RotateVector(Astronomy.Rotation_EQJ_ECT(t), vec);
  return norm(Astronomy.SphereFromVector(v).lon);
}
function meanNode(date) {
  const T = (date.getTime() / 86400000 + 2440587.5 - 2451545.0) / 36525;
  return norm(125.0445479 - 1934.1362891 * T + 0.0020754 * T * T);
}

  for (const b of BODIES) {
    out[b] = bodyLon(b, date);
    rx[b] = (b === "Sun" || b === "Moon") ? false : diff180(bodyLon(b, later) - out[b]) < 0;
  }

}

function lonFromRA(ra, eps) { return Math.atan2(Math.sin(ra) / Math.cos(eps), Math.cos(ra)); }

function housesAt(date, lat, lon) {
  const t = Astronomy.MakeTime(date);
  const ramcDeg = norm(Astronomy.SiderealTime(t) * 15 + lon);
  const eps = rad(Astronomy.e_tilt(t).tobl);
  const r = rad(ramcDeg), la = rad(lat);
  const mc = norm(deg(Math.atan2(Math.sin(r), Math.cos(r) * Math.cos(eps))));
  const asc = norm(deg(Math.atan2(Math.cos(r), -(Math.sin(r) * Math.cos(eps) + Math.tan(la) * Math.sin(eps)))));
  let cusps, system = "Placidus";
  if (Math.abs(lat) < 66) {
    const iter = (frac, below) => {
      let ra = r;
      for (let i = 0; i < 100; i++) {
        const lam = lonFromRA(ra, eps);
        const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
        const ad = deg(Math.asin(Math.max(-1, Math.min(1, Math.tan(la) * Math.tan(dec)))));
        ra = below ? r + rad(180) - rad(frac * (90 - ad)) : r + rad(frac * (90 + ad));
      }
      return norm(deg(lonFromRA(ra, eps)));
    };
    const c11 = iter(1 / 3, false), c12 = iter(2 / 3, false);
    const c3 = iter(1 / 3, true), c2 = iter(2 / 3, true);
    cusps = [asc, c2, c3, norm(mc + 180), norm(c11 + 180), norm(c12 + 180), norm(asc + 180), norm(c2 + 180), norm(c3 + 180), mc, c11, c12];
  } else { // polar fallback: whole-sign houses

    const start = Math.floor(asc / 30) * 30;
    cusps = Array.from({length: 12}, (_, i) => norm(start + 30 * i));
  }
  return {cusps, mc, asc, system};
}

  for (let i = 0; i < 12; i++) {
    const a = cusps[i], b = cusps[(i + 1) % 12];
    if (norm(lon - a) < norm(b - a)) return i + 1;
  }
  return 12;
}

function findAspects(A, B, same, scale = 1, filter) {
  const res = [];
  for (const a of Object.keys(A)) for (const b of Object.keys(B)) {
    if (same && a >= b) continue;
    const d = Math.abs(diff180(A[a] - B[b]));
    for (const asp of ASPECTS) {
      const o = Math.abs(d - asp.angle);
      if (o <= asp.orb * scale && (!filter || filter(a, b, asp))) res.push({a, b, asp, orb: o});
    }
  }
  return res.sort((x, y) => x.orb - y.orb);
}

/* ---- time zone helpers ---- */
function tzOffsetMinutes(utcMs, tz) {
  const f = new Intl.DateTimeFormat("en-US", {timeZone: tz, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric"});
  const p = {}; for (const x of f.formatToParts(new Date(utcMs))) p[x.type] = +x.value;
  return (Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - utcMs) / 60000;
}
function localToUtc(y, mo, d, h, mi, tz) {
  const naive = Date.UTC(y, mo - 1, d, h, mi, 0);
  let guess = naive - tzOffsetMinutes(naive, tz) * 60000;
  guess = naive - tzOffsetMinutes(guess, tz) * 60000;
  return new Date(guess);
}

/* ---- natal chart ---- */
function buildChart(birthUtc, lat, lon) {
  const p = planetsAt(birthUtc);
  const h = housesAt(birthUtc, lat, lon);
  const houses = {};
  for (const k of ORDER) houses[k] = houseOf(p.lon[k], h.cusps);
  const points = {...p.lon, Asc: h.asc, MC: h.mc};
  const aspects = findAspects(points, points, true, 1, (a, b) => !((a === "Asc" || a === "MC") && (b === "Asc" || b === "MC")));
  return {date: birthUtc, lat, lon, lonOf: p.lon, rx: p.rx, cusps: h.cusps, asc: h.asc, mc: h.mc, houseSystem: h.system, houses, aspects, points};
}

const RULER = {Aries:"Mars",Taurus:"Venus",Gemini:"Mercury",Cancer:"Moon",Leo:"Sun",Virgo:"Mercury",Libra:"Venus",Scorpio:"Pluto",Sagittarius:"Jupiter",Capricorn:"Saturn",Aquarius:"Uranus",Pisces:"Neptune"};
const TRAD_RULER = {...RULER, Scorpio:"Mars", Aquarius:"Saturn", Pisces:"Jupiter"};

/* ---- transits & forecasts ---- */
function transitSnapshot(chart, date) {
  const p = planetsAt(date);
  const houses = {}; for (const k of ORDER) houses[k] = houseOf(p.lon[k], chart.cusps);
  const slow = findAspects(p.lon, chart.points, false, 1, (a) => ["Jupiter","Saturn","Uranus","Neptune","Pluto","Node"].includes(a))
    .filter(x => x.orb <= (x.a === "Node" ? 2 : 3));
  const mars = findAspects(p.lon, chart.points, false, 1, a => a === "Mars").filter(x => x.orb <= 2);
  return {date, lon: p.lon, rx: p.rx, houses, aspects: [...slow, ...mars]};
}

function scanForecast(chart, start, days) {
  const events = [];
  const nat = chart.points;
  const dayMs = 86400000;
  const major = ASPECTS.filter(a => a.name !== "Sextile" || true);
  const fast = ["Sun","Mercury","Venus"];
  const mid = ["Mars"];
  const slow = ["Jupiter","Saturn","Uranus","Neptune","Pluto","Node"];
  let prev = null;
  for (let i = 0; i <= days; i++) {
    const d = new Date(start.getTime() + i * dayMs);
    const cur = planetsAt(d);
    if (prev) {
      for (const b of ORDER) {
        // ingress
        const s0 = Math.floor(prev.lon[b] / 30), s1 = Math.floor(cur.lon[b] / 30);
        if (s0 !== s1 && b !== "Moon" && (b !== "Node")) events.push({date: d, type: "ingress", body: b, sign: SIGNS[s1], rx: cur.rx[b]});
        if (b !== "Sun" && b !== "Moon" && b !== "Node" && prev.rx[b] !== cur.rx[b]) events.push({date: d, type: "station", body: b, dir: cur.rx[b] ? "retrograde" : "direct", lon: cur.lon[b]});
        // exact aspects to natal points
        const kind = fast.includes(b) ? 0 : mid.includes(b) ? 1 : 2;
        for (const [pn, nl] of Object.entries(nat)) {
          if (kind === 0 && !["Sun","Moon","Asc","MC"].includes(pn)) continue;
          if (kind === 1 && pn === "Node") continue;
          for (const asp of ASPECTS) {
            if (kind === 0 && asp.name === "Sextile") continue;
            const d0 = diff180(prev.lon[b] - nl - asp.angle), d1 = diff180(cur.lon[b] - nl - asp.angle);
            if (d0 * d1 <= 0 && Math.abs(d0) < 5 && Math.abs(d1) < 5 && !(asp.angle === 180 && (Math.abs(d0) > 5))) {
              if (asp.angle === 0 && b === pn) continue;
              events.push({date: d, type: "aspect", body: b, natal: pn, asp, weight: kind === 2 ? 3 : kind === 1 ? 2 : 1, rx: cur.rx[b]});
            }
          }
        }
      }
    }
    prev = cur;
  }
  // lunations and eclipses
  const end = new Date(start.getTime() + days * dayMs);
  const addPhases = (phase, label) => {
    let t = Astronomy.SearchMoonPhase(phase, start, days + 2);
    while (t && t.date <= end) {
      events.push({date: t.date, type: "lunation", phase: label, lon: bodyLon("Moon", t.date), sunLon: bodyLon("Sun", t.date)});
      t = Astronomy.SearchMoonPhase(phase, new Date(t.date.getTime() + 5 * dayMs), days + 2);
    }
  };
  addPhases(0, "New Moon"); addPhases(180, "Full Moon");
  try {
    let se = Astronomy.SearchGlobalSolarEclipse(start);
    while (se && se.peak.date <= end) { events.push({date: se.peak.date, type: "eclipse", kind: "Solar", sub: se.kind, lon: bodyLon("Sun", se.peak.date)}); se = Astronomy.NextGlobalSolarEclipse(se.peak); }
    let le = Astronomy.SearchLunarEclipse(start);
    while (le && le.peak.date <= end) { events.push({date: le.peak.date, type: "eclipse", kind: "Lunar", sub: le.kind, lon: bodyLon("Moon", le.peak.date)}); le = Astronomy.NextLunarEclipse(le.peak); }
  } catch (e) { /* eclipses optional */ }
  events.sort((a, b) => a.date - b.date);
  // dedupe aspects repeated on the same day
  const seen = new Set();
  return events.filter(e => {
    const k = e.type + e.date.toISOString().slice(0, 10) + (e.body || "") + (e.natal || "") + (e.asp ? e.asp.name : "") + (e.phase || "") + (e.kind || "") + (e.dir || "") + (e.sign || "");
    if (seen.has(k)) return false; seen.add(k); return true;
  });
}

function progressedPositions(chart, now) {
  const ageYears = (now - chart.date) / (365.2422 * 86400000);
  const pd = new Date(chart.date.getTime() + ageYears * 86400000);
  const p = planetsAt(pd);
  const out = {};
  for (const k of ["Sun","Moon","Mercury","Venus","Mars"]) out[k] = {lon: p.lon[k], house: houseOf(p.lon[k], chart.cusps)};
  return {age: ageYears, pos: out};
}

<script>/* Compose readings from a chart using the interpretation library. */
const ordinal = n => n + (["th","st","nd","rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)]);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function natalReading(c) {
  const sign = k => signOf(c.lonOf[k]);
  const ascS = signOf(c.asc), mcS = signOf(c.mc);
  const sun = sign("Sun"), moon = sign("Moon");
  const S = [];

  S.push({title: "Big Picture", paras: [
    `You are a ${ascS} Rising, ${sun} Sun, ${moon} Moon. In astrology the Sun shows your core self, the Moon your emotional needs, and the Rising sign the face you show the world and your approach to life.`,
    `Elements: ${elementSummary(c)} ${modalitySummary(c)}`,
  ]});
  S.push({title: `Rising Sign: ${ascS}`, paras: [RISING[ascS], `Your chart ruler is ${RULER[ascS]}${TRAD_RULER[ascS] !== RULER[ascS] ? " (traditionally " + TRAD_RULER[ascS] + ")" : ""}, in ${sign(RULER[ascS])} in the ${ordinal(c.houses[RULER[ascS]])} house (${HOUSE[c.houses[RULER[ascS]]]}). This placement shows where your life energy is most directed.`]});
  S.push({title: `Sun in ${sun}, ${ordinal(c.houses.Sun)} House`, paras: [SUN_SIGN[sun], `In the ${ordinal(c.houses.Sun)} house, your sense of purpose is focused on ${HOUSE[c.houses.Sun]}.`]});
  S.push({title: `Moon in ${moon}, ${ordinal(c.houses.Moon)} House`, paras: [MOON_SIGN[moon], `In the ${ordinal(c.houses.Moon)} house, your emotional life is tied to ${HOUSE[c.houses.Moon]}.`]});
  S.push({title: "Mind, Love and Drive", paras: [
    `Mercury in ${sign("Mercury")} (${ordinal(c.houses.Mercury)} house): ${cap(MERCURY_SIGN[sign("Mercury")])}, applied to ${HOUSE[c.houses.Mercury]}.`,
    `Venus in ${sign("Venus")} (${ordinal(c.houses.Venus)} house): in love and values you are ${VENUS_SIGN[sign("Venus")]}. Themes of affection and money connect to ${HOUSE[c.houses.Venus]}.`,
    `Mars in ${sign("Mars")} (${ordinal(c.houses.Mars)} house): your drive is ${MARS_SIGN[sign("Mars")]}, directed toward ${HOUSE[c.houses.Mars]}.`,
  ]});
  S.push({title: "Growth, Discipline and the Outer Planets", paras: [
    `Jupiter in ${sign("Jupiter")} (${ordinal(c.houses.Jupiter)} house): opportunity and optimism come through ${HOUSE[c.houses.Jupiter]}. You grow in a ${STYLE[sign("Jupiter")]} way.`,
    `Saturn in ${sign("Saturn")} (${ordinal(c.houses.Saturn)} house): your life lessons, responsibilities and eventual mastery are tied to ${HOUSE[c.houses.Saturn]}.${c.rx.Saturn ? " Saturn is retrograde, which often means self-imposed pressure and a late-blooming confidence." : ""}`,
    `Uranus in ${sign("Uranus")} (${ordinal(c.houses.Uranus)} house), Neptune in ${sign("Neptune")} (${ordinal(c.houses.Neptune)} house) and Pluto in ${sign("Pluto")} (${ordinal(c.houses.Pluto)} house) are generational placements; their houses show where you personally feel change (Uranus), idealism and confusion (Neptune), and deep transformation (Pluto): ${HOUSE[c.houses.Uranus]}; ${HOUSE[c.houses.Neptune]}; and ${HOUSE[c.houses.Pluto]}.`,
    `North Node in ${sign("Node")} (${ordinal(c.houses.Node)} house): your growth direction is ${NODE_SIGN[sign("Node")]}, particularly through ${HOUSE[c.houses.Node]}. (Mean node used; the South Node is in ${SIGNS[(SIGNS.indexOf(sign("Node")) + 6) % 12]}.)`,
  ]});

  // personality
  const strongest = c.aspects.filter(a => a.orb < 3).slice(0, 8);
  const aspParas = strongest.map(a => `${a.a} ${a.asp.name.toLowerCase()} ${a.b} (orb ${a.orb.toFixed(1)}°): this ${ASPECT_TEXT[a.asp.name]} ${PLANET[a.a]} and ${PLANET[a.b]}. ${PAIR_NOTE[pairKey(a.a, a.b)] || ""}`);
  S.push({title: "Personality: Strongest Aspects", paras: aspParas.length ? aspParas : ["No very tight aspects; the chart works through sign and house placements."]});

  const hard = c.aspects.filter(a => (a.asp.tone === "hard") && a.orb < 5 && !["Asc","MC"].includes(a.a) &&   !["Asc","MC"].includes(a.b)).slice(0, 5);  const easy = c.aspects.filter(a => a.asp.tone === "easy" && a.orb < 5 && !["Asc","MC"].includes(a.a) && !["Asc","MC"].includes(a.b)).slice(0, 4);
  S.push({title: "Strengths", paras: [
    `Sun in ${sun} and Moon in ${moon} give you: ${STYLE[sun]} willpower and ${STYLE[moon]} feelings. ${easy.length ? "Supportive aspects such as " + easy.map(a => `${a.a} ${a.asp.name.toLowerCase()} ${a.b}`).join(", ") + " are natural talents you can rely on." : ""}`,
  ]});
  S.push({title: "Growth Edges and Recurring Issues", paras: hard.length ? [
    `Challenging aspects show where life asks for growth: ${hard.map(a => `${a.a} ${a.asp.name.toLowerCase()} ${a.b} (${PAIR_NOTE[pairKey(a.a, a.b)] || PLANET[a.a] + " vs " + PLANET[a.b]})`).join(" ")}`,
    `Common lessons: balancing ${PLANET[hard[0].a]} with ${PLANET[hard[0].b]}${hard[1] ? ", and " + PLANET[hard[1].a] + " with " + PLANET[hard[1].b] : ""}.`,
  ] : ["No major hard aspects within a tight orb; growth tends to come from circumstances rather than inner tension."]});

  // career
  const tenth = c.houses, satH = c.houses.Saturn;
  const mcRuler = RULER[mcS];
  const inTenth = ORDER.filter(k => c.houses[k] === 10 && k !== "Node");
  const sixthSign = signOf(c.cusps[5]);
  S.push({title: "Career and Vocation", paras: [
    `Midheaven in ${mcS}: career themes suggest ${MC_CAREER[mcS]}. You want to be known for being ${STYLE[mcS]}.`,
    `The Midheaven ruler, ${mcRuler}, is in ${sign(mcRuler)} in the ${ordinal(c.houses[mcRuler])} house: your career path is shaped by ${HOUSE[c.houses[mcRuler]]}.`,
    inTenth.length ? `Planets in the 10th house (${inTenth.join(", ")}) give your public life extra emphasis: ${inTenth.map(k => PLANET[k]).join("; ")}.` : `No planets sit in the 10th house, so your career direction is read through the Midheaven ruler and the Sun (${sun}, ${ordinal(c.houses.Sun)} house).`,
    `Daily work style (6th house in ${sixthSign}): you work best in a ${STYLE[sixthSign]} way. Saturn in the ${ordinal(satH)} house shows where you build lasting mastery: ${HOUSE[satH]}.`,
    `Money: the 2nd house cusp is in ${signOf(c.cusps[1])}, so earning and spending tend to be ${STYLE[signOf(c.cusps[1])]}.${c.houses.Jupiter === 2 || c.houses.Venus === 2 ? " Jupiter or Venus in the 2nd house is a traditional sign of financial support." : ""}`,
  ]});
  S.push({title: "Health and Well-Being (symbolic, not medical advice)", paras: [
    `Rising sign ${ascS}: tends to relate to the ${BODY_AREA[ascS]}.`,
    `Sun in ${sun}: the ${BODY_AREA[sun]}. Moon in ${moon}: ${BODY_AREA[moon]}, and emotional stress often shows physically here.`,
    `The 6th house of health habits is in ${sixthSign}: routines that are ${STYLE[sixthSign]} suit you.`,
    `Always consult a qualified professional for any medical concern; astrology is a reflective tool only.`,
  ]});
  S.push({title: "Happiness and Fulfilment", paras: [
    SIGN_HAPPY[moon] + " (Moon in " + moon + ")",
    SIGN_HAPPY[sign("Venus")] + " (Venus in " + sign("Venus") + ")",
    `Jupiter in the ${ordinal(c.houses.Jupiter)} house suggests joy and good fortune through ${HOUSE[c.houses.Jupiter]}.`,
  ]});
  S.push({title: "Relationships", paras: [
    `Descendant in ${signOf(c.cusps[6])}: you are drawn to partners who are ${STYLE[signOf(c.cusps[6])]}. The 7th house cusp is in ${signOf(c.cusps[6])}${ORDER.filter(k => c.houses[k] === 7 && k !== "Node").length ? ", with " + ORDER.filter(k => c.houses[k] === 7 && k !== "Node").join(", ") + " in the 7th house, which strongly colors your partnerships" : ""}.`,
    `Venus in ${sign("Venus")}: ${VENUS_SIGN[sign("Venus")]}. Moon in ${moon}: ${MOON_SIGN[moon].toLowerCase()}`,
  ]});
  return S;
}

function elementSummary(c) {
  const cnt = {Fire: 0, Earth: 0, Air: 0, Water: 0};
  const pts = ["Sun","Moon","Mercury","Venus","Mars","Jupiter","Saturn"];
  for (const k of pts) cnt[ELEMENT[signOf(c.lonOf[k])]]++; cnt[ELEMENT[signOf(c.asc)]]++;
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  const low = top[top.length - 1];
  return `${top[0][0]} is your strongest element (${top.map(x => x[0] + " " + x[1]).join(", ")} among the seven classical planets and Ascendant). ${ELEMENT_TEXT[top[0][0]]}${low[1] === 0 ? " You have no planets in " + low[0] + ", so that area takes conscious effort." : ""}`;
}
function modalitySummary(c) {
  const cnt = {Cardinal: 0, Fixed: 0, Mutable: 0};
  for (const k of ["Sun","Moon","Mercury","Venus","Mars","Jupiter","Saturn"]) cnt[MODALITY[signOf(c.lonOf[k])]]++; cnt[MODALITY[signOf(c.asc)]]++;
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  return MODALITY_TEXT[top[0]];
}

const fmtDate = d => d.toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric", timeZone: "UTC"});
function monthKey(d) { return d.toLocaleDateString("en-US", {month: "long", year: "numeric", timeZone: "UTC"}); }

function describeEvent(e, c) {
  const date = fmtDate(e.date);
  if (e.type === "lunation") {
    const h = houseOf(e.lon, c.cusps);
    return {date, text: `${e.phase} in ${fmtLon(e.lon)} (your ${ordinal(h)} house): ${LUNATION_TEXT[e.phase]} around ${HOUSE[h]}.`, w: 2};
  }
  if (e.type === "eclipse") {
    const h = houseOf(e.lon, c.cusps);
    return {date, text: `${e.kind} eclipse (${e.sub}) at ${fmtLon(e.lon)} in your ${ordinal(h)} house: eclipses mark turning points and endings or beginnings in ${HOUSE[h]}; effects often unfold over several months.`, w: 4};
  }
  if (e.type === "station") {
    return {date, text: STATION_TEXT[e.body][e.dir] + ` (${e.body} ${e.dir} at ${fmtLon(e.lon)}, your ${ordinal(houseOf(e.lon, c.cusps))} house.)`, w: ["Mercury","Venus","Mars"].includes(e.body) ? 3 : 2};
  }
  if (e.type === "ingress") {
    if (["Sun","Mercury","Venus"].includes(e.body)) return null;
    const h = houseOf(SIGNS.indexOf(e.sign) * 30 + 1, c.cusps);
    return {date, text: `${e.body} enters ${e.sign}: ${TRANSIT_THEME[e.body]} ${HOUSE[h]} (your ${ordinal(h)} house).`, w: ["Jupiter","Saturn"].includes(e.body) ? 4 : 2};
  }
  if (e.type === "aspect") {
    const verb = e.asp.name === "Conjunction" ? "conjunct" : e.asp.name === "Opposition" ? "opposite" : e.asp.name.toLowerCase();
    const note = PAIR_NOTE[pairKey(e.body, e.natal)] ? " " + PAIR_NOTE[pairKey(e.body, e.natal)] : "";
    const tone = e.asp.tone === "easy" ? "supportive" : e.asp.tone === "hard" ? "challenging" : "intensifying";
    const nat = e.natal === "Asc" ? "your Ascendant" : e.natal === "MC" ? "your Midheaven" : `your natal ${e.natal}`;
    return {date, text: `Transiting ${e.body}${e.rx ? " (retrograde)" : ""} ${verb} ${nat}: a ${tone} contact; ${TRANSIT_THEME[e.body]} ${PLANET[e.natal]}.${note}`, w: e.weight + (["Asc","MC","Sun","Moon"].includes(e.natal) ? 1 : 0)};
  }
  return null;
}

function forecastReading(c, start, months, events) {
  const now = transitSnapshot(c, start);
  const out = {current: [], months: [], themes: [], progressed: null};
  for (const p of ["Jupiter","Saturn","Uranus","Neptune","Pluto"]) {
    const h = now.houses[p];
    out.current.push(`${p} in ${fmtLon(now.lon[p])}${now.rx[p] ? " ℞" : ""}, your ${ordinal(h)} house: ${SLOW_IN_HOUSE[p][0]} around ${HOUSE[h]}. ${SLOW_IN_HOUSE[p][1]}`);
  }
  for (const a of now.aspects.slice(0, 10)) {
    const verb = a.asp.name === "Conjunction" ? "conjunct" : a.asp.name === "Opposition" ? "opposite" : a.asp.name.toLowerCase();
    const nat = a.b === "Asc" ? "your Ascendant" : a.b === "MC" ? "your Midheaven" : `natal ${a.b}`;
    const tone = a.asp.tone === "easy" ? "supportive" : a.asp.tone === "hard" ? "challenging" : "intensifying";
    out.current.push(`Transiting ${a.a}${now.rx[a.a] ? " ℞" : ""} is ${verb} ${nat} (orb ${a.orb.toFixed(1)}°), a ${tone} influence on ${PLANET[a.b]}.${PAIR_NOTE[pairKey(a.a, a.b)] ? " " + PAIR_NOTE[pairKey(a.a, a.b)] : ""}`);
  }
  const buckets = new Map();
  for (const e of events) {
    const d = describeEvent(e, c); if (!d) continue;
    const k = monthKey(e.date); if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(d);
  }
  for (const [k, list] of buckets) out.months.push({month: k, items: list});
  // themes
  const jupH = now.houses.Jupiter, satH = now.houses.Saturn, plH = now.houses.Pluto;
  out.themes = [
    `Opportunity (Jupiter, ${ordinal(jupH)} house): ${HOUSE[jupH]}.`,
    `Pressure and building (Saturn, ${ordinal(satH)} house): ${HOUSE[satH]}.`,
    `Deep transformation (Pluto, ${ordinal(plH)} house): ${HOUSE[plH]}.`,
    `Change and awakening (Uranus, ${ordinal(now.houses.Uranus)} house): ${HOUSE[now.houses.Uranus]}.`,
    `Inspiration and fog (Neptune, ${ordinal(now.houses.Neptune)} house): ${HOUSE[now.houses.Neptune]}.`,
  ];
  const pr = progressedPositions(c, start);
  out.progressed = {age: pr.age, items: Object.entries(pr.pos).map(([k, v]) => `Progressed ${k} in ${fmtLon(v.lon)} (${ordinal(v.house)} house).`).concat([
    `Progressed Sun in ${signOf(pr.pos.Sun.lon)}: a life chapter of ${STYLE[signOf(pr.pos.Sun.lon)]} self-expression, focused on ${HOUSE[pr.pos.Sun.house]}.`,
    `Progressed Moon in ${signOf(pr.pos.Moon.lon)}: emotional tone for the next 2.5 years is ${STYLE[signOf(pr.pos.Moon.lon)]}, centered on ${HOUSE[pr.pos.Moon.house]}.`,
  ])};
  return out;
}

  const natal = a.b === "Asc" ? "Ascendant" : a.b === "MC" ? "Midheaven" : `natal ${a.b}`;
  const motion = p.rx[a.a] ? " retrograde" : "";
  return `${a.a}${motion} ${a.asp.name.toLowerCase()} ${natal} (${a.orb.toFixed(1)}°), moving through your ${ordinal(houseOf(p.lon[a.a], c.cusps))} house`;
};

function plannerDay(chart, value) {
  const date = utcDate(value), p = planetsAt(date), moonSign = signOf(p.lon.Moon), moon = MOON_GUIDE[moonSign];
  const raw = Object.fromEntries(PLANNER_DOMAINS.map(d => [d.key, 50]));
  const notes = Object.fromEntries(PLANNER_DOMAINS.map(d => [d.key, []]));
  const aspects = findAspects(p.lon, chart.points, false, .58, (a, b) => a !== "Node" && !(a === b && Math.abs(diff180(p.lon[a] - chart.points[b])) > 5));
  for (const a of aspects) {
    const tone = plannerAspectTone(a.a, a.asp);
    const exactness = Math.max(.15, 1 - a.orb / Math.max(1, a.asp.orb * .58));
    const impact = tone * (PLANET_WEIGHT[a.a] || 5) * exactness;
    const transitHouse = houseOf(p.lon[a.a], chart.cusps);
    const domains = new Set([...(PLANET_DOMAINS[a.a] || []), ...(PLANET_DOMAINS[a.b] || []), ...(HOUSE_DOMAINS[transitHouse] || [])]);
    const text = plannerAspectText(a, p, chart);
    for (const key of domains) {
      raw[key] += impact;
      notes[key].push({text, impact, exactness});
    }
  }
  for (const key of moon.boost) raw[key] += 4;
  for (const key of moon.ease) raw[key] -= 2;
  raw.overall += ((raw.love + raw.career + raw.money + raw.health + raw.creativity) / 5 - 50) * .35;
  const domains = PLANNER_DOMAINS.map(d => {
    const score = clampScore(raw[d.key]);
    const sorted = notes[d.key].sort((a, b) => Math.abs(b.impact) - Math.abs(a.impact));
    const totalStrength = sorted.slice(0, 4).reduce((sum, x) => sum + Math.abs(x.impact), 0);
    const confidence = sorted.length >= 4 && totalStrength >= 18 ? "High" : sorted.length >= 2 ? "Medium" : "Low";
    const strength = totalStrength >= 22 ? "Strong" : totalStrength >= 10 ? "Moderate" : "Subtle";
    const mode = score >= 64 ? "flow" : score <= 42 ? "caution" : "steady";
    const action = d.actions[(date.getUTCDate() + d.key.length) % d.actions.length];
    const avoid = d.cautions[(date.getUTCDate() + d.label.length) % d.cautions.length];
    return {...d, score, mode, confidence, strength, action, avoid, rationale: sorted.slice(0, 3).map(x => x.text)};

  const overall = domains.find(x => x.key === "overall");
  return {
    date: plannerDateKey(date), moonSign, moonLongitude:p.lon.Moon, color:moon.color,
    theme:`${moonSign} Moon: ${moon.theme}. ${strongest.label} has the clearest tailwind.`,
    genre:moon.genre, overall:overall.score, domains,
    best:domains.filter(x => x.key !== "overall").sort((a, b) => b.score - a.score).slice(0, 3).map(x => x.key),
    cautions:domains.filter(x => x.key !== "overall").sort((a, b) => a.score - b.score).slice(0, 2).map(x => x.key),
    transitCount:aspects.length
  };
}

function plannerMonth(chart, year, monthIndex) {
  const days = new Date(Date.UTC(year, monthIndex + 1, 0)).getUTCDate();
  return Array.from({length:days}, (_, i) => plannerDay(chart, new Date(Date.UTC(year, monthIndex, i + 1, 12))));
}

function plannerHighlights(days, domainKey = "overall") {
  const score = d => (d.domains.find(x => x.key === domainKey) || d.domains[0]).score;
  const ranked = [...days].sort((a, b) => score(b) - score(a));
  return {best:ranked.slice(0, 4), caution:[...ranked].reverse().slice(0, 4)};
}

<script>/* Chart-twin matching against FAMOUS_DB rows: [name, description, category, dob, place, lons[11], asc|null, mc|null]
   lons order: Sun Moon Mercury Venus Mars Jupiter Saturn Uranus Neptune Pluto Node. Rows without a birth time (asc null)
   use local noon, so Moon is approximate and Rising/Midheaven are never compared. */
const DB_KEYS = ["Sun", "Moon", "Mercury", "Venus", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune", "Pluto", "Node"];
const DB_CACHE = new Map();
function dbChart(row) {
  let c = DB_CACHE.get(row);
  if (c) return c;
  const lonOf = {};
  DB_KEYS.forEach((k, i) => lonOf[k] = row[5][i]);
  const timed = row[6] != null;
  c = {lonOf, timed, asc: timed ? row[6] : 0, mc: timed ? row[7] : 0, aspects: findAspects(lonOf, lonOf, true)};
  DB_CACHE.set(row, c);
  return c;
}

/* Scores resemblance: sign placements, tight degree matches, element balance and shared aspects. */
function compareCharts(c, row, timeKnown) {
  const o = dbChart(row), why = [], both = timeKnown && o.timed;
  let score = 0, max = 0;
  const add = (pts, tot, text) => { max += tot; if (pts > 0) { score += pts; if (text) why.push(text); } };
  const SG = [["Sun", 4], ["Moon", 4], ["Mercury", 2], ["Venus", 2], ["Mars", 2], ["Jupiter", 1], ["Saturn", 1], ["Uranus", .4], ["Neptune", .3], ["Pluto", .3]];
  for (const [k, w] of SG) {
    const same = signOf(c.lonOf[k]) === signOf(o.lonOf[k]);
    const tol = (k === "Moon" && !o.timed) ? 0 : 5;
    const close = tol > 0 && Math.abs(diff180(c.lonOf[k] - o.lonOf[k])) <= tol;
    add(same ? w : 0, w, same ? `${k} in ${signOf(c.lonOf[k])}` + (close ? " (within 5 deg)" : "") : "");
    if (tol > 0 && ["Sun", "Moon", "Mercury", "Venus", "Mars"].includes(k)) { max += 1; if (same && close) score += 1; }
  }
  if (both) {
    add(signOf(c.asc) === signOf(o.asc) ? 4 : 0, 4, `${signOf(c.asc)} Rising`);
    add(signOf(c.mc) === signOf(o.mc) ? 1.5 : 0, 1.5, `${signOf(c.mc)} Midheaven`);
  }
  const ev = cos(elementVec(c, both), elementVec(o, both));
  add(Math.max(0, (ev - .6) / .4) * 4, 4, ev > .93 ? "very similar element balance" : ev > .85 ? "similar element balance" : "");
  const personal = ["Sun", "Moon", "Mercury", "Venus", "Mars", "Jupiter", "Saturn"];
  const key = a => a.a + "|" + a.b + "|" + a.asp.name;
  const mine = new Set(c.aspects.filter(a => personal.includes(a.a) && personal.includes(a.b) && a.orb < 5).map(key));
  const shared = o.aspects.filter(a => personal.includes(a.a) && personal.includes(a.b) && mine.has(key(a)) && a.orb < 5);
  add(Math.min(shared.length, 4) * 1.25, 5, shared.length ? "shared aspects: " + shared.slice(0, 3).map(a => `${a.a} ${a.asp.name.toLowerCase()} ${a.b}`).join(", ") : "");
  return {f: row, pct: Math.round(100 * score / max), why, chart: o, approx: !o.timed};
}
function closestFamous(c, timeKnown, n = 8) {
  return FAMOUS_DB.map(r => compareCharts(c, r, timeKnown)).sort((a, b) => b.pct - a.pct).slice(0, n);
}
</script>

/* ---------- Wheel ---------- */
function wheelSVG(c, size = 720) {
  const cx = size / 2, R = size / 2 - 6, Rz = R * .86, Rh = R * .70, Rp = R * .58, Rin = R * .38;
  const ang = lon => rad(180 + (lon - c.asc));
  const pt = (r, lon) => [cx + r * Math.cos(ang(lon)), cx - r * Math.sin(ang(lon))];
  const L = (r1, r2, lon, st, w = 1) => { const a = pt(r1, lon), b = pt(r2, lon); return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${st}" stroke-width="${w}"/>`; };
  const ELC = ["#ff8a6b", "#8fe3b4", "#ffe38a", "#7fb4ff"];
  let s = `<svg class="wheel" id="wheel" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" font-family="Segoe UI Symbol,Apple Symbols,Noto Sans Symbols,sans-serif"><defs><radialGradient id="wg"><stop offset="0" stop-color="#121a52"/><stop offset="1" stop-color="#070b24"/></radialGradient></defs><rect width="${size}" height="${size}" fill="url(#wg)"/>`;
  s += `<circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="#8ea2ff" stroke-opacity=".5" stroke-width="1.5"/><circle cx="${cx}" cy="${cx}" r="${Rz}" fill="none" stroke="#8ea2ff" stroke-opacity=".5"/><circle cx="${cx}" cy="${cx}" r="${Rh}" fill="none" stroke="#8ea2ff" stroke-opacity=".35"/><circle cx="${cx}" cy="${cx}" r="${Rin}" fill="none" stroke="#8ea2ff" stroke-opacity=".5"/>`;
  for (let i = 0; i < 12; i++) {
    const a0 = i * 30; s += L(R, Rz, a0, "#8ea2ff", 1);
    const m = pt((R + Rz) / 2, a0 + 15);
    s += `<text x="${m[0].toFixed(1)}" y="${m[1].toFixed(1)}" fill="${ELC[i % 4]}" font-size="${size * .036}" text-anchor="middle" dominant-baseline="central">${SIGN_GLYPH[i]}</text>`;
    for (let t = 5; t < 30; t += 5) s += L(Rz, Rz - (t % 10 === 0 ? 5 : 3), a0 + t, "#8ea2ff", .6);
  }
  c.cusps.forEach((cu, i) => {
    const major = i % 3 === 0;
    s += L(major ? R : Rz, Rin, cu, major ? "#ffd58a" : "#8ea2ff", major ? 1.8 : .8);
    const m = pt((Rh + Rin) / 2 + 12, cu + (((c.cusps[(i + 1) % 12] - cu) + 360) % 360) / 2);
    s += `<text x="${m[0].toFixed(1)}" y="${m[1].toFixed(1)}" fill="#8f9bd0" font-size="${size * .02}" text-anchor="middle" dominant-baseline="central">${i + 1}</text>`;
  });
  const labels = [["Asc", c.asc], ["MC", c.mc], ["Dsc", c.asc + 180], ["IC", c.mc + 180]];
  for (const [t, l] of labels) { const p = pt(R + 0, l), q = pt(Rin, l); s += `<text x="${(pt(R * .975, l)[0]).toFixed(1)}" y="${(pt(R * .975, l)[1]).toFixed(1)}" fill="#ffd58a" font-size="${size * .02}" font-weight="700" text-anchor="middle" dominant-baseline="central" opacity="0">${t}</text>`; }
  const tone = {easy: "#6fe0a4", hard: "#ff7f92", neutral: "#ffd58a"};
  for (const a of c.aspects) {
    if (a.orb > 6) continue;
    const p = pt(Rin - 2, c.points[a.a]), q = pt(Rin - 2, c.points[a.b]);
    s += `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke="${tone[a.asp.tone]}" stroke-opacity="${(0.75 - a.orb / 12).toFixed(2)}" stroke-width="1.1"/>`;
  }
  const items = ORDER.map(k => ({k, lon: c.lonOf[k], d: c.lonOf[k]})).sort((a, b) => a.lon - b.lon);
  for (let pass = 0; pass < 40; pass++) for (let i = 0; i < items.length; i++) {
    const a = items[i], b = items[(i + 1) % items.length];
    let gap = norm(b.d - a.d); if (items.length > 1 && i === items.length - 1) gap = norm(b.d - a.d);
    if (gap < 8) { const push = (8 - gap) / 2; a.d -= push; b.d += push; }
  }
  for (const it of items) {
    const p = pt(Rp, it.d), t0 = pt(Rh, it.lon), t1 = pt(Rh - 6, it.lon), lp = pt(Rp - R * .075, it.d);
    s += `<line x1="${t0[0].toFixed(1)}" y1="${t0[1].toFixed(1)}" x2="${t1[0].toFixed(1)}" y2="${t1[1].toFixed(1)}" stroke="#ffd58a" stroke-width="1.2"/>`;
    s += `<text x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" fill="#fff" font-size="${size * .042}" text-anchor="middle" dominant-baseline="central">${GLYPH[it.k]}</text>`;
    s += `<text x="${lp[0].toFixed(1)}" y="${lp[1].toFixed(1)}" fill="#aab6ee" font-size="${size * .017}" text-anchor="middle" dominant-baseline="central">${Math.floor(norm(it.lon) % 30)}°${c.rx[it.k] ? "℞" : ""}</text>`;
  }
  for (const [t, l] of [["ASC", c.asc], ["MC", c.mc]]) {
    const p = pt(R + 0, l), o = pt(R - 14, l);
    s += `<text x="${o[0].toFixed(1)}" y="${o[1].toFixed(1)}" fill="#ffd58a" font-size="${size * .02}" font-weight="700" text-anchor="middle" dominant-baseline="central">${t}</text>`;
  }
  return s + "</svg>";
}

  $("#pdate").onchange = e => {

  $("#ptoday").onclick = () => { plannerSelected = new Date().toISOString().slice(0,10); plannerAnchor = utcDate(plannerSelected); $("#pdate").value = plannerSelected; load(); };
  $("#pprev").onclick = () => { plannerAnchor = new Date(Date.UTC(plannerAnchor.getUTCFullYear(),plannerAnchor.getUTCMonth()-1,1,12)); plannerSelected = plannerDateKey(plannerAnchor); $("#pdate").value = plannerSelected; load(); };
  $("#pnext").onclick = () => {

    if (next > max) { out.innerHTML = lockCard(`More than ${tier().plannerMonths} month${tier().plannerMonths === 1 ? "" : "s"} of daily planning`, tier().plannerMonths < 6 ? "free_ads" : "pro"); return; }

}
function scoreClass(score) { return score >= 64 ? "flow" : score <= 42 ? "caution" : "steady"; }
function plannerHtml(days, selected) {
  const first = utcDate(days[0].date).getUTCDay(), highlights = plannerHighlights(days, plannerDomain);
  const scoreFor = day => day.domains.find(x => x.key === plannerDomain).score;
  const calendar = `${Array.from({length:first}, () => `<span class="cal-empty"></span>`).join("")}${days.map(day => {
    const score = scoreFor(day), n = +day.date.slice(-2);
    return `<button class="cal-day ${scoreClass(score)} ${day.date === selected.date ? "selected" : ""}" data-pday="${day.date}" aria-label="${plannerDateLabel(day.date)}, ${score} out of 100"><span>${n}</span><b>${score}</b><i style="background:${day.color}"></i></button>`;
  }).join("")}`;
  const list = arr => arr.map(d => `<button class="day-link" data-pday="${d.date}"><span>${utcDate(d.date).toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"})}</span><b>${scoreFor(d)}</b></button>`).join("");
  return `<div class="planner-layout fade"><div class="card calendar-card"><div class="section-head"><div><span class="eyebrow">${PLANNER_DOMAIN[plannerDomain].label}</span><h2>${plannerMonthLabel(plannerAnchor)}</h2></div><div class="legend"><span class="flow">Flow</span><span class="steady">Steady</span><span class="caution">Caution</span></div></div>
    <div class="weekdays">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x => `<span>${x}</span>`).join("")}</div><div class="calendar">${calendar}</div>
    <div class="highlights"><div><h3>Best windows</h3>${list(highlights.best)}</div><div><h3>Use more care</h3>${list(highlights.caution)}</div></div></div>
    <div>${plannerDetailHtml(selected)}</div></div>${sponsoredCard("planner")}
    <div class="card safety fade"><b>Use this as symbolic weather, not a verdict.</b><p>Scores compare transit patterns within this calendar. They cannot promise luck, diagnose health, determine relationship outcomes, or replace professional advice and real-world safety checks.</p></div>`;
}
function plannerDetailHtml(day) {
  const domains = plannerDomain === "overall" ? day.domains : day.domains.filter(x => x.key === plannerDomain || x.key === "overall");
  const moon = `<div class="moon-strip"><span class="moon-dot" style="background:${day.color}"></span><div><span class="eyebrow">Daily Moon</span><b>${esc(day.moonSign)} · ${esc(fmtLon(day.moonLongitude))}</b><small>Theme: ${esc(day.theme)}<br>Color cue: <span style="color:${day.color}">${esc(day.color.toUpperCase())}</span> · Entertainment: ${esc(day.genre)}</small></div></div>`;
  const cards = domains.map(d => `<article class="domain-card ${scoreClass(d.score)}"><div class="score-ring" style="--score:${d.score}"><b>${d.score}</b><span>/100</span></div><div class="domain-copy"><span class="eyebrow">${d.icon} ${esc(d.label)} · ${d.strength} signal · ${d.confidence} confidence</span><h3>${d.mode === "flow" ? "A constructive window" : d.mode === "caution" ? "Slow down and check assumptions" : "Work with the conditions"}</h3><p><b>Try:</b> ${esc(d.action)}</p><p><b>Avoid:</b> ${esc(d.avoid)}</p>${d.rationale.length ? `<details><summary>Why this score</summary><ul>${d.rationale.map(r => `<li>${esc(r)}</li>`).join("")}</ul></details>` : `<p class="tiny">No tight major transit dominates this area; the score stays near neutral.</p>`}</div></article>`).join("");

function forecastHtml(f) {

/* ---------- Chart twins ---------- */
function miniWheel(c, size = 120) {
  const cx = size / 2, R = cx - 3, ang = l => rad(180 + (l - c.asc)), pt = (r, l) => [cx + r * Math.cos(ang(l)), cx - r * Math.sin(ang(l))];
  let s = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cx}" r="${R}" fill="#0b1032" stroke="#8ea2ff" stroke-opacity=".5"/><circle cx="${cx}" cy="${cx}" r="${R * .75}" fill="none" stroke="#8ea2ff" stroke-opacity=".25"/>`;
  for (let i = 0; i < 12; i++) { const a = pt(R, i * 30), b = pt(R * .75, i * 30); s += `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#8ea2ff" stroke-opacity=".3"/>`; }
  for (const k of ORDER) { const p = pt(R * .55, c.lonOf[k]); s += `<text x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" fill="#fff" font-size="11" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI Symbol,sans-serif">${GLYPH[k]}</text>`; }
  return s + "</svg>";
}
function twinsView() {
  const known = !prof.unknownTime, res = closestFamous(chart, known, tier().twins);
  const cards = res.map((r, i) => `<div class="card lift fade"><div style="display:flex;gap:16px;align-items:center"><div>${miniWheel(r.chart)}</div><div style="min-width:0"><div class="tier" style="font-size:11px;letter-spacing:1px;color:var(--gold);font-weight:700;text-transform:uppercase">#${i + 1} · ${r.pct}% resemblance · ${esc(r.f[2])}</div><h2 style="margin:2px 0">${esc(r.f[0])}</h2><div class="mut tiny">${esc(r.f[1])} · born ${esc(r.f[3])} · ${esc(r.f[4])}</div></div></div>
  <div class="chips"><span class="chip g">☉ ${signOf(r.chart.lonOf.Sun)}</span><span class="chip g">☽ ${signOf(r.chart.lonOf.Moon)}</span>${r.approx ? '<span class="chip">birth time unknown</span>' : `<span class="chip g">Asc ${signOf(r.chart.asc)}</span>`}</div>
  <p>${r.why.length ? "What you share: " + esc(r.why.join("; ")) + "." : "Only loose similarities."}</p>
  <div class="actions"><a class="btn sm ghost" href="${esc(famousDbLink(r.f[0]))}" target="_blank" rel="noopener">Astro-Databank</a></div></div>`).join("");
  return `<div class="card fade"><h1>Chart twins</h1><p class="mut">Closest matches to ${esc(prof.name)}'s chart among ${FAMOUS_DB.length} well-known (and infamous) people. Scoring weights Sun, Moon and Rising signs most, then the personal planets, tight degree matches, element balance and shared aspects.${known ? "" : " Rising sign and Midheaven are skipped because your birth time is unknown."}</p>
  <p class="tiny">A resemblance is a symbolic similarity, not a prediction that you share someone's fate. Most entries (those marked "birth time unknown") are computed for local noon, so their Moon is approximate and Rising/Midheaven are not compared. Birth dates and places come from Wikidata (CC0). Many Astro-Databank times are disputed, and people with similar charts live very different lives.</p></div><div class="grid2">${cards}</div>${tier().twins < 25 ? lockCard("More chart twins", tier().twins < 10 ? "supporter" : "pro") : ""}`;
}

/* ---------- News ---------- */
function newsShell() {
  return `<div class="card fade"><h1>Astrology News</h1><p class="mut">Latest articles and episodes from established astrology publishers, fetched live and refreshed hourly. Each link opens the publisher's own site.</p><div class="actions"><button class="btn sm" id="nrefresh">Refresh</button></div></div><div id="nout"></div>`;
}
function runNews() {
  const out = $("#nout");
  const go = async force => {
    out.innerHTML = `<div class="card"><span class="spin"></span>Loading the latest articles…</div>`;
    const n = await loadNews(force);
    if (!n.items.length) { out.innerHTML = `<div class="card"><p class="msg err">Couldn't load feeds (offline?). Visit the publishers directly:</p><div class="chips">${FEEDS.map(f => `<a class="chip" href="${esc(f.site)}" target="_blank" rel="noopener">${esc(f.name)}</a>`).join("")}</div></div>`; return; }
    const safeImg = u => /^https:\/\//.test(u || "") ? u : "";
    out.innerHTML = (n.stale ? `<p class="msg">Showing saved articles (offline).</p>` : "") +
      `<div class="grid2">${n.items.slice(0, 36).map(a => `<a class="card lift news fade" href="${esc(a.link)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${safeImg(a.img) ? `<img src="${esc(safeImg(a.img))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}<div class="tier" style="font-size:11px;letter-spacing:1px;color:var(--gold);font-weight:700;text-transform:uppercase">${esc(a.source)}${a.date ? " · " + new Date(a.date).toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric"}) : ""}</div><h3 style="color:var(--txt);margin:4px 0 6px">${esc(a.title)}</h3><p class="tiny">${esc(a.summary)}</p></a>`).join("")}</div>` +
      (n.failed && n.failed.length ? `<p class="tiny">Unavailable right now: ${esc(n.failed.join(", "))}.</p>` : "");
  };
  $("#nrefresh").onclick = () => go(true); go(false);
}

/* ---------- Starfield ---------- */
function stars() {
  const cv = $("#stars"), x = cv.getContext("2d"); let S = [];
  const size = () => { cv.width = innerWidth; cv.height = innerHeight; S = Array.from({length: Math.round(innerWidth * innerHeight / 7000)}, () => ({x: Math.random() * cv.width, y: Math.random() * cv.height, r: Math.random() * 1.3 + .2, p: Math.random() * 6.28, s: Math.random() * .02 + .005})); };
  size(); addEventListener("resize", size);
  const draw = () => { x.clearRect(0, 0, cv.width, cv.height); for (const s of S) { s.p += s.s; x.globalAlpha = .35 + .5 * Math.abs(Math.sin(s.p)); x.fillStyle = "#fff"; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.283); x.fill(); } requestAnimationFrame(draw); };
  matchMedia("(prefers-reduced-motion: reduce)").matches ? (S.forEach(s => { x.fillStyle = "#fff"; x.globalAlpha = .6; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.283); x.fill(); })) : draw();
}
