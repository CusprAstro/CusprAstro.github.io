name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p site/launch site/icons
          cp index.html site.css offline.html privacy.html terms.html refunds.html affiliate.html support.html membership.html product-facts.html site/
          cp launch/index.html launch/manifest.webmanifest launch/sw.js site/launch/
          cp icons/Cuspr_icon_*.png icons/Cuspr_Gumroad_600.png site/icons/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
