name: Build and sign public releases

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/release.py --public-only
      - uses: sigstore/cosign-installer@v3
      - name: Keyless sign public artifacts
        shell: bash
        run: |
          set -euo pipefail
          for file in release-assets/*.zip release-assets/SHA256SUMS release-assets/*.spdx.json; do
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" \
              --bundle "${file}.bundle" \
              "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cuspr-${{ github.ref_name }}-signed
          path: release-assets/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cuspr-${{ github.ref_name }}-signed
          path: release-assets
      - name: Publish signed public artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --prerelease --generate-notes --title "Cuspr $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            release-assets/*.zip* \
            release-assets/SHA256SUMS* \
            release-assets/*.spdx.json*
