name: Build and sign beta artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Beta version label
        required: true
        default: 0.4.0-beta
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Build public locked editions
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version "${{ inputs.version }}"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release/Cuspr-${{ inputs.version }}.spdx.json
      - name: Refresh checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object Name -ne SHA256SUMS | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content release/SHA256SUMS -Encoding ascii
      - uses: sigstore/cosign-installer@v3
      - name: Keyless-sign checksums and artifacts
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -in ".zip", ".json" -and $_.Name -notmatch "Unlocked-Pro" } | ForEach-Object {
            cosign sign-blob --yes --bundle "$($_.FullName).sigstore.json" $_.FullName
          }
          cosign sign-blob --yes --bundle "release/SHA256SUMS.sigstore.json" "release/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: Cuspr-${{ inputs.version }}-signed
          path: |
            release/Cuspr-${{ inputs.version }}-Free.zip
            release/Cuspr-${{ inputs.version }}-Free-with-Ads.zip
            release/Cuspr-${{ inputs.version }}-Supporter.zip
            release/Cuspr-${{ inputs.version }}-Pro.zip
            release/Cuspr-${{ inputs.version }}.spdx.json
            release/*.sigstore.json
            release/SHA256SUMS
          if-no-files-found: error
